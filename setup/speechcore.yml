# speechcore —— 覆盖 exp1(特征提取) / exp2(CharRNN) / exp3(FACodec) / exp6(ASR)
# 统一使用 torch 2.1.2 + CUDA 11.8（满足 exp3 的硬钉死版本）
# 创建: conda env create -f setup/speechcore.yml
name: speechcore
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      # librosa 0.10.1 仍依赖 pkg_resources, 需 setuptools<81 (新版已移除)
      - "setuptools<81"
      # ---- PyTorch (cu118) ----
      - torch==2.1.2+cu118
      - torchvision==0.16.2+cu118
      - torchaudio==2.1.2+cu118
      # ---- 公共科学计算 ----
      - "numpy<2"
      - scipy
      - matplotlib
      - pandas
      - tqdm
      # ---- 音频 (exp1/exp3) ----
      - librosa==0.10.1
      - soundfile
      - einops          # exp3 FACodec
      - pyworld         # exp3 FACodec
      # ---- exp1 深度特征 (wav2vec2 / hubert) ----
      - transformers==4.36.2
      # ---- exp2 CharRNN ----
      - opencc-python-reimplemented
      # ---- notebook 内核 ----
      - ipykernel
